<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent Wrap'D</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src https://dosu.dev; form-action 'none'; base-uri 'none'">
<link rel="preload" href="https://dosu.dev/fonts/PPMondwest-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="https://dosu.dev/fonts/mona-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Dosu's faces, served by dosu.dev. Offline, the page falls back to Georgia and the system sans. */
@font-face { font-family: "PP Mondwest"; src: url("https://dosu.dev/fonts/PPMondwest-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Mona Sans"; src: url("https://dosu.dev/fonts/mona-sans-latin.woff2") format("woff2"); font-weight: 300 700; font-display: swap; }
:root {
  --display: "PP Mondwest", ui-serif, Georgia, serif;
  --sans: "Mona Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --gold: #c9a771; --gold-dark: #6e5834;
  --pink: #ee67d1; --pink-edge: #b4459c; --pink-text: #390038;
  --ink: #1c1c1c; --dark: #0e0e0e; --dark-2: #131313; --night: #1e2539;
  --parchment: #fefae7; --cream: #e6e3d7; --paper: #f4f1e6;
  --ease: cubic-bezier(.2,.8,.2,1);
  --pad: clamp(20px, 5vw, 80px);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--dark); color: var(--paper); font-family: var(--sans); font-synthesis: none; overflow: hidden; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }

/* story bars */
#progress { position: fixed; top: 14px; left: var(--pad); right: var(--pad); z-index: 20; display: flex; gap: 4px; pointer-events: none; }
#progress span { flex: 1; height: 4px; background: currentColor; opacity: .22; transition: opacity .3s; }
#progress span.done { opacity: .9; }

/* slides: the next one opens as a circle from where you tapped; the old one waits underneath */
#stage { position: fixed; inset: 0; }
.slide { position: absolute; inset: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: center; padding: 64px var(--pad) 48px; background: var(--s-bg); color: var(--s-fg); visibility: hidden; z-index: 1; clip-path: circle(0% at var(--ox, 100%) var(--oy, 50%)); }
.slide.on { visibility: visible; z-index: 2; clip-path: circle(150% at var(--ox, 100%) var(--oy, 50%)); transition: clip-path .75s cubic-bezier(.65,0,.2,1); }
.slide.under { visibility: visible; clip-path: none; }
.slide > .content { position: relative; z-index: 2; display: flex; flex-direction: column; }
/* slides with factory art keep their words up top and the scene along the bottom */
.slide.scene { justify-content: flex-start; padding-top: clamp(64px, 13vh, 150px); }

/* factory art from dosu.dev */
.art { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; pointer-events: none; display: flex; justify-content: center; }
.art img { display: block; }
.art.conveyor img { width: min(92vw, 1000px, 120vh); height: auto; margin-bottom: clamp(48px, 7vh, 72px); }
.art.skyline img { width: 100%; height: min(46vh, 56vw); object-fit: cover; object-position: 72% 100%; -webkit-mask-image: linear-gradient(to bottom, transparent, #000 45%); mask-image: linear-gradient(to bottom, transparent, #000 45%); }
.art.skyline.dim img { opacity: .55; }

/* the opening slide is a game's title screen */
.slide.title { align-items: center; text-align: center; }
.mark { width: clamp(56px, 9vh, 84px); height: auto; margin-bottom: clamp(20px, 4vh, 40px); }
.slide.title > .content { align-items: center; }
.slide.title .label { margin-top: clamp(16px, 2.6vh, 28px); color: var(--s-muted); }
.start { margin-top: clamp(22px, 4vh, 44px); font-size: 13px; color: var(--gold); }
.slide.on .start { animation: blink 1.1s steps(1) 1.8s infinite; }
@keyframes blink { 50% { opacity: 0; } }
.art { opacity: 0; transform: translateY(30px); transition: opacity .7s ease .35s, transform 1s var(--ease) .35s; }
.slide.on .art { opacity: 1; transform: none; }

/* type */
.q { font-family: var(--display); font-weight: 400; font-size: clamp(30px, min(4.6vw, 7vh), 64px); line-height: 1.02; letter-spacing: -.01em; max-width: 18ch; }
.big { font-family: var(--display); font-weight: 400; font-size: clamp(92px, min(19vw, 28vh), 280px); line-height: .86; letter-spacing: -.02em; white-space: nowrap; }
.big.md { font-size: clamp(66px, min(13vw, 21vh), 210px); }
.label { font-weight: 600; font-size: clamp(18px, min(2vw, 3.4vh), 28px); line-height: 1.2; letter-spacing: -.01em; max-width: 26ch; margin-top: clamp(10px, 1.6vh, 18px); }
.note { font-weight: 500; font-size: clamp(15px, min(1.3vw, 2.4vh), 19px); line-height: 1.45; max-width: 46ch; margin-top: clamp(14px, 2.4vh, 26px); color: var(--s-muted); }
.mono { font-family: var(--mono); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }

/* the site's gold rule, diamonds on both ends */
.rule { position: relative; height: 2px; width: min(100%, 980px); background: var(--s-rule); margin: clamp(16px, 2.8vh, 30px) 0; transform-origin: left; transform: scaleX(0); transition: transform .9s var(--ease) .2s; }
.rule::before, .rule::after { content: ""; position: absolute; top: -4px; width: 10px; height: 10px; background: inherit; rotate: 45deg; }
.rule::before { left: -5px; } .rule::after { right: -5px; }
.slide.on .rule { transform: none; }

/* reveal */
.in { opacity: 0; transform: translateY(26px); transition: opacity .5s ease, transform .8s var(--ease); transition-delay: var(--d, 120ms); }
.slide.on .in { opacity: 1; transform: none; }

/* spectrum: a segmented meter that fills one block at a time, like a game's power bar */
.spec { margin-top: clamp(22px, 4vh, 44px); max-width: 980px; }
.spec .ends { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 10px; }
.spec .ends span:last-child { text-align: right; }
.meter { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 3px; height: clamp(16px, 2.4vh, 24px); }
.meter i { background: color-mix(in srgb, currentColor 16%, transparent); }
.slide.on .meter i.lit { background: var(--s-accent); transition: background-color 0s linear calc(.7s + var(--k) * 40ms); }

/* where your fixes live */
.fixes { margin-top: clamp(6px, 1vh, 12px); display: grid; gap: clamp(10px, 1.6vh, 16px); max-width: 900px; }
.fixes > div { display: grid; grid-template-columns: 10em 1fr 3.4em; gap: 16px; align-items: center; font-weight: 600; font-size: clamp(15px, 1.4vw, 20px); }
.fixes .meter { height: clamp(14px, 2.2vh, 22px); }
.fixes b { font-family: var(--display); font-weight: 400; font-size: 1.3em; text-align: right; }

/* the site's buttons: mono caps with a raised edge */
.btn { font: 700 14px/1 var(--mono); text-transform: uppercase; letter-spacing: .02em; border: 1px solid rgba(255,255,255,.3); border-radius: 6px; padding: 14px 18px 12px; cursor: pointer; text-decoration: none; display: inline-block; background: var(--paper); color: var(--ink); box-shadow: 0 4px 0 0 var(--edge, #898989); transition: transform .15s ease-out, box-shadow .15s ease-out, filter .15s; }
.btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 0 var(--edge, #898989); filter: brightness(1.08); }
.btn:active { transform: translateY(4px); box-shadow: 0 0 0 0 var(--edge, #898989); transition-duration: .07s; }
.btn.pink { background: var(--pink); color: var(--pink-text); --edge: var(--pink-edge); }
.btn.quiet { background: color-mix(in srgb, var(--s-bg, var(--dark-2)) 85%, transparent); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); color: inherit; border: 1.5px dashed color-mix(in srgb, currentColor 75%, transparent); box-shadow: none; }
.btn.quiet:hover { transform: none; border-color: currentColor; }
.btn:focus-visible { outline: 2px solid var(--pink-edge); outline-offset: 3px; }
.cta-row { margin-top: clamp(20px, 3.4vh, 34px); }

/* result: a card made to be screenshotted */
.slide.result { align-items: center; padding-top: 120px; }
.slide.result > .content { align-items: center; }
.card { position: relative; width: min(440px, 100%); }
.kicker { width: min(440px, 100%); margin-bottom: 12px; font-size: 13px; color: var(--gold); }
.poster { position: relative; width: 100%; aspect-ratio: 9 / 11; max-height: calc(100dvh - 250px); border-radius: 14px; overflow: hidden; background: var(--dark-2); color: var(--paper); border: 2px solid rgba(201,167,113,.55); padding: 26px 24px 18px; display: flex; flex-direction: column; box-shadow: 0 30px 60px -20px rgba(0,0,0,.8); }
.poster > * { position: relative; }
.poster .yr { color: rgba(244,241,230,.65); }
.poster .nm { font-family: var(--display); font-weight: 400; font-size: clamp(44px, min(11vw, 8.4vh), 68px); line-height: .9; margin-top: 14px; color: var(--gold); }
.poster .ln { font-weight: 500; font-size: 15px; line-height: 1.35; margin-top: 10px; max-width: 26ch; }
.poster .rule { margin: auto 0 16px; transform: none; --s-rule: rgba(201,167,113,.55); width: 100%; }
/* D sits on the card's top edge: body above it, legs hanging over the front */
.card .sprite { position: absolute; z-index: 3; right: 22px; top: 0; width: clamp(150px, 44%, 200px); transform: translateY(-56%); filter: drop-shadow(0 6px 0 rgba(0,0,0,.25)); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
.stats b { display: block; font-family: var(--display); font-weight: 400; font-size: clamp(30px, min(7vw, 5.4vh), 44px); line-height: 1; }
.stats span { display: block; font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; line-height: 1.3; margin-top: 5px; color: rgba(244,241,230,.65); }
.poster .foot { margin-top: 16px; display: flex; align-items: center; justify-content: space-between; color: rgba(244,241,230,.65); }
.poster .foot img { height: 22px; width: auto; }
.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 22px; }

/* share: the card as an image, plus the link */
#sharebox { margin: auto; width: min(520px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); overflow: auto; padding: 22px; border: 2px solid rgba(201,167,113,.55); border-radius: 14px; background: var(--dark-2); color: var(--paper); box-shadow: 0 30px 80px rgba(0,0,0,.6); }
#sharebox::backdrop { background: rgba(14,14,14,.75); }
#sharebox[open] { animation: pop .25s var(--ease); }
@keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.98); } }
.sb-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.sb-head h2 { font-family: var(--display); font-weight: 400; font-size: 32px; line-height: 1; }
.sb-close { background: none; border: 0; color: rgba(244,241,230,.65); cursor: pointer; padding: 6px; }
.sb-close:hover { color: var(--paper); }
.sb-img { margin-top: 16px; aspect-ratio: 4 / 5; width: min(100%, 54dvh * .8); margin-inline: auto; border-radius: 8px; overflow: hidden; background: var(--night); }
.sb-img canvas { display: block; width: 100%; height: 100%; }
.sb-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.sb-actions.three { grid-template-columns: repeat(3, 1fr); margin-top: 12px; }
.sb-actions .btn { padding: 12px 6px 10px; font-size: 13px; text-align: center; white-space: nowrap; }
.sb-msg { min-height: 1.4em; margin-top: 12px; color: var(--gold); }

@media (max-width: 700px) {
  .slide { justify-content: safe center; padding-top: 72px; }
  .slide.scene { padding-top: 72px; }
  .fixes > div { grid-template-columns: 8.4em 1fr 2.6em; gap: 10px; }
  .slide.result { justify-content: center; padding: 110px 16px 24px; }
  .poster { max-height: calc(100dvh - 220px); }
}
@media (prefers-reduced-motion: reduce) {
  .in, .slide, .art, .rule, .meter i { transition-duration: .01ms !important; transition-delay: 0ms !important; }
  .slide.on .start, #sharebox[open] { animation: none; }
}
</style>
</head>
<body>
<div id="progress" aria-hidden="true"></div>
<main id="stage" aria-live="polite"></main>
<dialog id="sharebox" aria-labelledby="sb-title">
  <div class="sb-head"><h2 id="sb-title">Share your card</h2><button class="sb-close mono" type="button" data-act="close">Close</button></div>
  <div class="sb-img"></div>
  <div class="sb-actions">
    <button class="btn pink" type="button" data-act="primary">Copy image</button>
    <button class="btn" type="button" data-act="download">Download</button>
  </div>
  <div class="sb-actions three">
    <button class="btn quiet" type="button" data-act="link">Copy link</button>
    <button class="btn quiet" type="button" data-act="linkedin">LinkedIn</button>
    <button class="btn quiet" type="button" data-act="x">X</button>
  </div>
  <p class="sb-msg mono" role="status"></p>
</dialog>

<script id="wrapped-data" type="application/json">__WRAPPED_DATA__</script>
<script>
(() => {
"use strict";
const D = JSON.parse(document.getElementById("wrapped-data").textContent);
const T = D.totals, F = D.factors || [], P = D.profile || {}, L = D.layers || {}, R = D.recap || {};
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

const abbr = n => {
  n = Number(n) || 0;
  for (const [d, s] of [[1e12, "T"], [1e9, "B"], [1e6, "M"], [1e3, "K"]]) {
    if (Math.abs(n) >= d) { const v = n / d; return (v >= 100 ? v.toFixed(0) : v.toFixed(1).replace(/\.0$/, "")) + s; }
  }
  return String(Math.round(n));
};
const int = n => Math.round(Number(n) || 0).toLocaleString("en-US");
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const dur = m => m >= 90 ? `${Math.floor(m / 60)}h ${Math.round(m % 60)}m` : `${Math.round(m)} min`;

/* ---------- the site's palette, one surface per slide ---------- */
const LOOKS = {
  intro:   { bg: "var(--dark)", fg: "var(--paper)", muted: "rgba(244,241,230,.7)", rule: "var(--gold)", accent: "var(--gold)" },
  hours:   { bg: "var(--night)", fg: "var(--paper)", muted: "rgba(244,241,230,.7)", rule: "var(--gold)", accent: "var(--gold)", art: "skyline" },
  babysit: { bg: "var(--dark)", fg: "var(--paper)", muted: "rgba(244,241,230,.62)", rule: "var(--gold)", accent: "var(--pink)" },
  quick:   { bg: "var(--pink)", fg: "var(--pink-text)", muted: "rgba(57,0,56,.75)", rule: "var(--pink-text)", accent: "var(--pink-text)" },
  verify:  { bg: "var(--cream)", fg: "var(--ink)", muted: "rgba(28,28,28,.7)", rule: "var(--gold-dark)", accent: "var(--ink)" },
  trust:   { bg: "var(--night)", fg: "var(--paper)", muted: "rgba(244,241,230,.7)", rule: "var(--gold)", accent: "var(--gold)" },
  line:    { bg: "var(--gold)", fg: "var(--ink)", muted: "rgba(28,28,28,.75)", rule: "var(--ink)", accent: "var(--ink)" },
  pitch:   { bg: "var(--dark)", fg: "var(--paper)", muted: "rgba(244,241,230,.62)", rule: "var(--gold)", accent: "var(--pink)", art: "conveyor" },
  result:  { bg: "var(--night)", fg: "var(--paper)", muted: "rgba(244,241,230,.7)", rule: "var(--gold)", accent: "var(--gold)", art: "skyline dim" },
};
const ART = {
  conveyor: `<img src="__CONVEYOR__" alt="">`,
  skyline: `<img src="__SKYLINE__" alt="">`,
};
const LOGO = `<img src="__DOSU_LOGO__" alt="Dosu">`;

const meter = (filled, n = 20) => {
  const lit = Math.max(1, Math.min(n, Math.round((filled / 100) * n)));
  return `<div class="meter" style="--n:${n}">${Array.from({ length: n }, (_, k) => `<i${k < lit ? ` class="lit" style="--k:${k}"` : ""}></i>`).join("")}</div>`;
};

/* what D thinks about each factor */
const NOTES = {
  babysit: "You hover when you can't tell how it's going. Give the agent a way to check itself and you can look away.",
  quick: "The next agent copies whatever fix you accept. The real fix now costs one more prompt.",
  verify: "Let a test say it's done. It's cheaper than reading the diff yourself.",
  trust: "A lint rule catches it every time. A correction you type lasts one session.",
  line: "More agents only help when each one can finish without you.",
};
const slides = [];
const add = (key, html, o = {}) => slides.push({ html, look: LOOKS[key] || LOOKS.babysit, ...o });

add("intro", `
  <img class="mark in" src="__DOSU_LOGO__" alt="Dosu">
  <h1 class="big md in" style="--d:200ms">Your ${D.year}<br>with agents</h1>
  <p class="label in" style="--d:400ms">${esc(D.name || "Hey")}, I read ${int(T.sessions)} of your sessions. Nothing left this computer.</p>
  <p class="mono start in" style="--d:900ms">Press → or tap to start</p>`, { cls: "title" });

const book = (D.books || []).find(b => b.title === "War and Peace") || (D.books || [])[0];
add("hours", `
  <p class="q in">Your agents worked</p>
  <div class="rule"></div>
  <div class="big in" style="--d:250ms">${int(T.agent_hours)} hours</div>
  <p class="label in" style="--d:500ms">${abbr(T.tokens)} tokens${book ? `, about ${int(book.copies)} copies of <i>${esc(book.title)}</i>` : ""}.</p>`);

const FIXES = [["static", "Tests and lint"], ["verification", "Runtime checks"], ["prose", "Rule files"], ["review", "You, by hand"]];
function fixes() {
  const mx = Math.max(1, ...FIXES.map(([k]) => L[k] || 0));
  return `<div class="fixes in" style="--d:250ms">${FIXES.map(([k, label]) => `<div><span>${label}</span>${meter((100 * (L[k] || 0)) / mx, 16)}<b>${int(L[k] || 0)}</b></div>`).join("")}</div>`;
}

F.forEach(f => {
  const hero = f.key === "trust" ? fixes() : `
    <div class="big ${f.hero.length > 4 ? "md" : ""} in" style="--d:250ms">${esc(f.hero)}</div>
    <p class="label in" style="--d:450ms">${esc(f.label)}</p>`;
  add(f.key, `
    <h2 class="q in">${esc(f.question)}</h2>
    <div class="rule"></div>
    ${hero}
    <div class="spec in" style="--d:650ms">
      <div class="ends mono"><span>${esc(f.low)}</span><span>${esc(f.high)}</span></div>
      ${meter(f.score)}
    </div>
    <p class="note in" style="--d:850ms">${esc(NOTES[f.key] || "")}</p>`);
});

/* what Dosu does about it, in the product's own terms (dosu.dev) */
add("pitch", `
  <p class="q in">You stepped in</p>
  <div class="rule"></div>
  <div class="big md in" style="--d:250ms">${int(R.stepped_in)} times</div>
  <p class="label in" style="--d:450ms">Each one is a moment an agent got stuck.</p>
  <p class="note in" style="--d:650ms">Dosu finds the ones your whole team keeps hitting and fixes them. It's in beta, with early access for a select number of users.</p>
  <div class="cta-row in" style="--d:850ms"><a class="btn pink" href="https://dosu.dev/?utm_source=wrapd&utm_medium=wrap&utm_content=pitch" target="_blank" rel="noopener noreferrer">Get early access to Dosu</a></div>
  <p class="mono start in" style="--d:1100ms">Press → or tap to see your archetype</p>`);

add("result", `
  <p class="mono kicker in">Your archetype</p>
  <div class="card in">
  <img class="sprite" src="__DOSU_D__" alt="">
  <div class="poster">
    <div class="yr mono">Agent Wrap'D ${D.year}</div>
    <div class="nm">${esc(P.name || "")}</div>
    <div class="ln">“${esc(cap(P.line || ""))}.”</div>
    <div class="rule"></div>
    <div class="stats">
      <div><b>${int(R.agent_hours)}h</b><span>your agents worked</span></div>
      <div><b>${dur(R.longest_run_minutes || 0)}</b><span>longest without you</span></div>
      <div><b>${int(R.stepped_in)}</b><span>times you stepped in</span></div>
      <div><b>${abbr(R.context_words)}</b><span>words of context</span></div>
    </div>
    <div class="foot mono"><span>dosu.dev/wrapd</span>${LOGO}</div>
  </div>
  </div>
  <div class="actions in" style="--d:450ms">
    <button id="share" class="btn pink">Share</button>
    <button id="replay" class="btn quiet">Replay</button>
    <a class="btn quiet" href="https://dosu.dev/?utm_source=wrapd&utm_medium=wrap&utm_content=card" target="_blank" rel="noopener noreferrer">What's Dosu?</a>
  </div>`, { cls: "result", final: true });

/* ---------- build ---------- */
const stage = document.getElementById("stage"), prog = document.getElementById("progress");
document.title = `Agent Wrap'D ${D.year}`;
slides.forEach(s => {
  const el = document.createElement("section");
  const k = s.look, art = k.art ? k.art.split(" ")[0] : "";
  el.className = ["slide", s.cls, art && !s.final ? "scene" : ""].filter(Boolean).join(" ");
  el.style.cssText = `--s-bg:${k.bg};--s-fg:${k.fg};--s-muted:${k.muted};--s-rule:${k.rule};--s-accent:${k.accent}`;
  el.innerHTML = (art ? `<div class="art ${k.art}" aria-hidden="true">${ART[art]}</div>` : "") + `<div class="content">${s.html}</div>`;
  stage.appendChild(el);
  s.el = el;
  s.seg = prog.appendChild(document.createElement("span"));
});

let cur = -1, origin = null;
function go(i) {
  i = Math.max(0, Math.min(slides.length - 1, i));
  if (i === cur) return;
  const prev = cur >= 0 ? slides[cur] : null;
  const s = slides[i];
  const [ox, oy] = origin || (i > cur ? ["100%", "50%"] : ["0%", "50%"]);
  origin = null;
  s.el.style.setProperty("--ox", ox);
  s.el.style.setProperty("--oy", oy);
  slides.forEach(x => x.el.classList.remove("under"));
  if (prev) { prev.el.classList.add("under"); prev.el.classList.remove("on"); }
  void s.el.offsetWidth;
  s.el.classList.add("on");
  cur = i;
  prog.style.color = s.look.fg;
  slides.forEach((x, k) => x.seg.classList.toggle("done", k <= cur));
  if (prev) setTimeout(() => { if (slides[cur] !== prev) prev.el.classList.remove("under"); }, reduce ? 0 : 800);
}
const next = () => go(cur + 1);

stage.addEventListener("click", e => {
  if (e.target.closest("button, a")) return;
  if (slides[cur].final) return;
  origin = [e.clientX + "px", e.clientY + "px"];
  if (e.clientX < innerWidth * .25) go(cur - 1); else next();
});
/* ---------- share: draw the card on a canvas, 1080x1350 ---------- */
const LINKEDIN = "https://www.linkedin.com/sharing/share-offsite/?url=";
const XPOST = "https://x.com/intent/post?text=";
const FILE = `agent-wrapd-${D.year}.png`;

function wrap(ctx, text, max) {
  const lines = [];
  let line = "";
  for (const word of text.split(" ")) {
    const t = line ? line + " " + word : word;
    if (line && ctx.measureText(t).width > max) { lines.push(line); line = word; } else line = t;
  }
  return line ? [...lines, line] : lines;
}

async function drawCard() {
  await Promise.all(['400 100px "PP Mondwest"', '500 28px "Mona Sans"'].map(f => document.fonts.load(f).catch(() => {})));
  const W = 1080, H = 1350, c = document.createElement("canvas");
  c.width = W; c.height = H;
  const x = c.getContext("2d");
  const css = getComputedStyle(document.documentElement);
  const v = n => css.getPropertyValue(n).trim();
  const font = (w, px, fam) => `${w} ${px}px ${v(fam)}`;
  const sky = slides[1].el.querySelector(".art img"), dee = document.querySelector(".card .sprite"), logo = document.querySelector(".poster .foot img");
  const GOLD = "#c9a771", PAPER = "#f4f1e6", MUTED = "rgba(244,241,230,.65)", RULE = "rgba(201,167,113,.55)";

  x.fillStyle = v("--night"); x.fillRect(0, 0, W, H);
  if (sky && sky.naturalWidth) {
    const sh = sky.naturalHeight, sw = sh * (W / 640), sx = (sky.naturalWidth - sw) * .72;
    x.globalAlpha = .55; x.drawImage(sky, sx, 0, sw, sh, 0, H - 640, W, 640); x.globalAlpha = 1;
    const g = x.createLinearGradient(0, H - 640, 0, H - 380);
    g.addColorStop(0, v("--night")); g.addColorStop(1, "rgba(30,37,57,0)");
    x.fillStyle = g; x.fillRect(0, H - 640, W, 260);
  }

  // The card grows with the name and quote, then sits a little below center so D fits on top.
  x.font = font(400, 100, "--display");
  const nameLines = wrap(x, P.name || "", 540);
  x.font = font(500, 30, "--sans");
  const quoteLines = wrap(x, `“${cap(P.line || "")}.”`, 560);
  const cw = 800, pad = 56, ch = 178 + nameLines.length * 92 + quoteLines.length * 42 + 400;
  const cx = (W - cw) / 2, cy = Math.round((H - ch) / 2 + 90);
  x.save();
  x.shadowColor = "rgba(0,0,0,.6)"; x.shadowBlur = 60; x.shadowOffsetY = 30;
  x.fillStyle = v("--dark-2"); x.beginPath(); x.roundRect(cx, cy, cw, ch, 26); x.fill();
  x.restore();
  x.strokeStyle = RULE; x.lineWidth = 4; x.beginPath(); x.roundRect(cx, cy, cw, ch, 26); x.stroke();

  const mono = (text, px, color, tx, ty, align = "left") => {
    x.font = font(500, px, "--mono"); x.fillStyle = color; x.textAlign = align;
    x.letterSpacing = "1.5px"; x.fillText(text.toUpperCase(), tx, ty); x.letterSpacing = "0px"; x.textAlign = "left";
  };
  mono(`Agent Wrap'D ${D.year}`, 22, MUTED, cx + pad, cy + 76);
  x.font = font(400, 100, "--display"); x.fillStyle = GOLD;
  let y = cy + 178;
  for (const l of nameLines) { x.fillText(l, cx + pad, y); y += 92; }
  x.font = font(500, 30, "--sans"); x.fillStyle = PAPER;
  for (const l of quoteLines) { x.fillText(l, cx + pad, y); y += 42; }

  const footY = cy + ch - 52, r2 = footY - 76, r1 = r2 - 128, ruleY = r1 - 112;
  x.fillStyle = RULE; x.fillRect(cx + pad, ruleY - 1.5, cw - 2 * pad, 3);
  for (const ex of [cx + pad, cx + cw - pad]) { x.save(); x.translate(ex, ruleY); x.rotate(Math.PI / 4); x.fillRect(-7, -7, 14, 14); x.restore(); }
  const stats = [[`${int(R.agent_hours)}h`, "your agents worked"], [dur(R.longest_run_minutes || 0), "longest without you"], [int(R.stepped_in), "times you stepped in"], [abbr(R.context_words), "words of context"]];
  stats.forEach(([val, label], i) => {
    const sx = i % 2 ? cx + cw / 2 + 12 : cx + pad, sy = i < 2 ? r1 : r2;
    x.font = font(400, 72, "--display"); x.fillStyle = PAPER; x.fillText(val, sx, sy - 34);
    mono(label, 18, MUTED, sx, sy);
  });
  mono("dosu.dev/wrapd", 20, MUTED, cx + pad, footY);
  if (logo && logo.naturalWidth) x.drawImage(logo, cx + cw - pad - 46, footY - 40, 46, 48);

  if (dee && dee.naturalWidth) {
    x.save(); x.shadowColor = "rgba(0,0,0,.25)"; x.shadowOffsetY = 10;
    x.drawImage(dee, cx + cw - 40 - 340, cy - 340 * .56, 340, 340);
    x.restore();
  }
  return c;
}

const box = document.getElementById("sharebox"), msg = box.querySelector(".sb-msg"), primary = box.querySelector('[data-act="primary"]');
let png = null;
const say = t => { msg.textContent = t; clearTimeout(say.t); say.t = setTimeout(() => { msg.textContent = ""; }, 2600); };
const copyText = t => navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject();
const shareFile = () => png && new File([png], FILE, { type: "image/png" });
const canShareFile = () => !!(navigator.canShare && png && navigator.canShare({ files: [shareFile()] }));

async function openShare() {
  if (!box.open) box.showModal();
  if (png) return;
  const c = await drawCard();
  box.querySelector(".sb-img").replaceChildren(c);
  png = await new Promise(r => c.toBlob(r, "image/png"));
  if (canShareFile() && matchMedia("(pointer: coarse)").matches) primary.textContent = "Share image";
}

box.addEventListener("click", e => {
  if (e.target === box) return box.close();
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (act === "close") box.close();
  if (!png && act !== "close") return;
  if (act === "primary") {
    if (primary.textContent === "Share image") navigator.share({ files: [shareFile()], text: P.share }).catch(() => {});
    else if (window.ClipboardItem && navigator.clipboard?.write) navigator.clipboard.write([new ClipboardItem({ "image/png": png })]).then(() => say("Image copied. Paste it anywhere"), () => say("Can't copy here. Download it instead"));
    else say("Can't copy here. Download it instead");
  }
  if (act === "download") {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(png); a.download = FILE; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }
  if (act === "link") copyText(P.url || "").then(() => say("Link copied"), () => say(P.url || ""));
  if (act === "linkedin") window.open(LINKEDIN + encodeURIComponent(P.url || ""), "_blank", "noopener");
  if (act === "x") window.open(XPOST + encodeURIComponent(P.share || ""), "_blank", "noopener");
});

stage.addEventListener("click", e => {
  if (e.target.id === "replay") go(0);
  if (e.target.id === "share") openShare();
});
addEventListener("keydown", e => {
  if (box.open) return;
  if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === "Enter" || e.key === " ") { e.preventDefault(); next(); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") go(cur - 1);
  else if (e.key === "Home") go(0);
  else if (e.key === "End") go(slides.length - 1);
});
let touchX = null;
stage.addEventListener("touchstart", e => { touchX = e.touches[0].clientX; }, { passive: true });
stage.addEventListener("touchend", e => {
  if (touchX == null) return;
  const dx = e.changedTouches[0].clientX - touchX; touchX = null;
  if (Math.abs(dx) > 50) { e.preventDefault(); origin = [dx < 0 ? "100%" : "0%", e.changedTouches[0].clientY + "px"]; if (dx < 0) next(); else go(cur - 1); }
});

go(0);
})();
</script>
